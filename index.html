<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eisuke Hayashi</title>
<meta name="description" content="林 栄介 — 東京理科大学 創域理工学部 電気電子情報工学科">
<style>
  :root { --ink: #16181D; --sub: #5A5F69; --bg: #FFFFFF; --line: #E2E2E2; }
  @media (prefers-color-scheme: dark) { :root { --ink: #EDEDED; --sub: #9CA1AA; --bg: #111214; --line: #2A2C30; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { margin: 0; font-size: clamp(32px, 8vw, 48px); font-weight: 700; letter-spacing: 0.16em; }
  .mono { font-family: Menlo, "DejaVu Sans Mono", ui-monospace, monospace; }
  .roman { margin: 8px 0 0; color: var(--sub); font-size: 16px; }
  .cursor { display: inline-block; width: 0.55em; height: 1.05em; background: var(--ink); vertical-align: -0.18em; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0 24px; }
  p { margin: 4px 0; line-height: 1.7; }
  .sub { color: var(--sub); }
  .status { margin-top: 24px; font-size: 14px; color: var(--sub); }
  a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>林 栄介</h1>
  <p class="roman mono">Hayashi Eisuke</p>
  <hr>
  <p>東京理科大学 創域理工学部 電気電子情報工学科</p>
  <p class="sub">自動運転・ロボティクス・AI</p>
  <p class="mono" style="margin-top: 16px"><a href="mailto:eisuke.hayashi.dev@gmail.com">eisuke.hayashi.dev@gmail.com</a></p>
  <p class="status mono">$ portfolio --status<br>&gt; coming soon<br>$ <span class="cursor" aria-hidden="true"></span></p>
</main>
</body>
</html>
